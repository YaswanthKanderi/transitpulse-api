services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transitpulse}
      POSTGRES_USER: ${POSTGRES_USER:-transitpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transitpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transitpulse}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-transitpulse}
      POSTGRES_USER: ${POSTGRES_USER:-transitpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transitpulse}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
